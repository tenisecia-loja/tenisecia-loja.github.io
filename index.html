<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tênis&amp;Cia Premium — Catálogo</title>
<meta name="theme-color" content="#0c0c0c">
<style>body{margin:0;background:#0c0c0c;color:#d1aa66;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;text-align:center}a{color:#e8cc94}</style>
</head>
<body>
<p id="m">Carregando…</p>
<script>
var API = 'https://script.google.com/macros/s/AKfycbxTosBd6fNKe-6rmc89J5D1hmS3YKJyWM_-HDavsmsty5SxL6-moLN0fa4cS3_YncJQ/exec';
var pg = /painel/.test(location.pathname + location.search) ? 'painel' : 'catalogo';
function go(n) {
  fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: 'pagina', args: [pg] }) })
  .then(function (r) { return r.json(); })
  .then(function (j) { if (!j.ok) throw 0; document.open(); document.write(j.r); document.close(); })
  .catch(function () { if (n < 2) return go(n + 1); document.getElementById('m').innerHTML = 'Não foi possível carregar agora.<br><a href="">Tentar de novo</a>'; });
}
go(0);
</script>
</body>
</html>
